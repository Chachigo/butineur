name: Feature request
description: Suggest something Butineur should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to be able to do?
      description: The need first, not the solution.
      placeholder: I would like to be able to…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How do you picture it?
      description: Optional — the need alone is a valid request.
  - type: checkboxes
    id: searched
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this idea.
          required: true
